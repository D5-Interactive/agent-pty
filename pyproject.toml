[project]
name = "agent-pty"
version = "0.4.0"
description = "SSH with persistent background PTY sessions, port forwarding, file transfer, and audit logging"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dsient", email = "dsient@users.noreply.github.com" }]
keywords = ["ssh", "pty", "terminal", "remote", "automation", "port-forwarding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.1",
    "paramiko>=5.1.0",
]

[project.scripts]
agent-pty = "agent_pty:main"

[dependency-groups]
dev = ["build>=1.6.1", "pytest>=8.0", "ruff>=0.17"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
